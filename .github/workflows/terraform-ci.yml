name: Terraform CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.17.2
  # 再現性を優先するなら 1.0.322 のようにバージョンを固定する。
  # 一覧: https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/versions.json
  AWS_EMULATOR_VERSION: latest
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform:
    name: plan / apply on AWS Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: Start AWS Emulator
        uses: ./.github/actions/setup-aws-emulator
        with:
          version: ${{ env.AWS_EMULATOR_VERSION }}

      - name: Enable emulator-only provider override
        run: cp emulator/aws_provider_override.tf terraform/

      - name: terraform init
        run: terraform -chdir=terraform init

      - name: terraform validate
        run: terraform -chdir=terraform validate

      - name: terraform plan
        run: terraform -chdir=terraform plan -out=tfplan

      - name: terraform apply
        run: terraform -chdir=terraform apply tfplan
