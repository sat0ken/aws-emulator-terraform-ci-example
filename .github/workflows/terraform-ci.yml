name: Terraform CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.17.2
  # 再現性を優先するなら ghcr.io/xsavikx/aws-emulator:1.0.322 のようにタグを固定する。
  AWS_EMULATOR_IMAGE: ghcr.io/xsavikx/aws-emulator:latest
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform:
    name: plan / apply on AWS Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      # AWS Emulator をコンテナで起動し、AWS_ENDPOINT_URL などの接続設定を以降のステップに渡す
      - name: Start AWS Emulator
        uses: xSAVIKx/run-aws-emulator@3a10c6c7da7da236e5d0014a38f85d25f5060a73 # v1.0.1
        with:
          image: ${{ env.AWS_EMULATOR_IMAGE }}
          region: ap-northeast-1

      - name: Enable emulator-only provider override
        run: cp emulator/aws_provider_override.tf terraform/

      - name: terraform init
        run: terraform -chdir=terraform init

      - name: terraform validate
        run: terraform -chdir=terraform validate

      - name: terraform plan
        run: terraform -chdir=terraform plan -out=tfplan

      - name: terraform apply
        run: terraform -chdir=terraform apply tfplan
