name: Setup AWS Emulator
description: >-
  AWS Emulator (https://github.com/aws/aws-emulator) をインストールしてバックグラウンドで起動し、
  以降のステップの AWS CLI / SDK / Terraform がエミュレーターに接続するよう環境変数を設定する。

inputs:
  version:
    description: >-
      インストールするバージョン（例: 1.0.322）。latest なら最新版。
      バージョン一覧: https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/versions.json
    default: latest
  port:
    description: エミュレーターが待ち受けるポート。
    default: "9297"
  region:
    description: AWS_REGION / AWS_DEFAULT_REGION に設定するリージョン。
    default: ap-northeast-1
  idle-timeout:
    description: API 呼び出しがこの秒数なければエミュレーターを自動停止する（停止し忘れ防止）。
    default: "3600"
  telemetry:
    description: テレメトリーの送信（on / off）。
    default: "off"

outputs:
  version:
    description: 起動したエミュレーターのバージョン。
    value: ${{ steps.start.outputs.version }}
  endpoint-url:
    description: エミュレーターのエンドポイント URL。
    value: ${{ steps.start.outputs.endpoint-url }}
  config-dir:
    description: 資格情報・config・証明書が置かれるディレクトリ。
    value: ${{ steps.start.outputs.config-dir }}
  log-file:
    description: エミュレーターのログファイル。
    value: ${{ steps.start.outputs.log-file }}

runs:
  using: composite
  steps:
    - name: Guard against real AWS credentials
      shell: bash
      run: |
        # 環境変数の資格情報は credentials ファイルより優先されるため、残っていると
        # 本物の AWS に署名付きリクエストが飛んでしまう。ここで確実に止める。
        for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE; do
          if [ -n "${!v:-}" ]; then
            echo "::error::$v が設定されています。AWS Emulator を使うジョブでは本物の資格情報を設定しないでください。"
            exit 1
          fi
        done

    - name: Install AWS Emulator
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        base=https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS

        case "${RUNNER_ARCH}" in
          X64)   arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::unsupported runner arch: ${RUNNER_ARCH}"; exit 1 ;;
        esac

        if [ "${VERSION}" = "latest" ]; then
          url="${base}/latest/aws-emulator_${arch}.deb"
        else
          url="${base}/aws-emulator_${VERSION}-1_${arch}.deb"
        fi

        pkg="${RUNNER_TEMP}/aws-emulator.deb"
        echo "Downloading ${url}"
        curl -fsSL --retry 3 -o "${pkg}" "${url}"
        sudo apt-get install -y --no-install-recommends "${pkg}" > /dev/null
        rm -f "${pkg}"
        aws-emulator -v

    - name: Start AWS Emulator
      id: start
      shell: bash
      env:
        PORT: ${{ inputs.port }}
        IDLE_TIMEOUT: ${{ inputs.idle-timeout }}
        TELEMETRY: ${{ inputs.telemetry }}
      run: |
        set -euo pipefail
        dir="${HOME}/.aws/emulator/${PORT}"
        log="${RUNNER_TEMP}/aws-emulator/aws-emulator.log"
        mkdir -p "$(dirname "${log}")"

        # バックグラウンドで起動する。プロセスはジョブ終了まで生き続け、
        # 万一残っても --idle-timeout で自動停止する。
        nohup aws-emulator \
          --port "${PORT}" \
          --telemetry "${TELEMETRY}" \
          --idle-timeout "${IDLE_TIMEOUT}" \
          > "${log}" 2>&1 &
        pid=$!

        # ヘルスチェックが通るまで最大 60 秒待つ。
        # （ca.pem は起動完了時に作られるので、それまでは curl が失敗する）
        for _ in $(seq 60); do
          if curl -sf --cacert "${dir}/ca.pem" "https://127.0.0.1:${PORT}/__admin/health" > /dev/null 2>&1; then
            ready=1
            break
          fi
          if ! kill -0 "${pid}" 2> /dev/null; then
            break
          fi
          sleep 1
        done

        if [ -z "${ready:-}" ]; then
          echo "::error::AWS Emulator が起動しませんでした"
          cat "${log}"
          exit 1
        fi

        version=$(aws-emulator -v | awk '/^Version:/ { print $2 }')
        echo "AWS Emulator ${version} is ready on https://127.0.0.1:${PORT}"

        {
          echo "version=${version}"
          echo "endpoint-url=https://127.0.0.1:${PORT}"
          echo "config-dir=${dir}"
          echo "log-file=${log}"
        } >> "${GITHUB_OUTPUT}"

    - name: Point AWS SDKs at the emulator
      shell: bash
      env:
        PORT: ${{ inputs.port }}
        REGION: ${{ inputs.region }}
        DIR: ${{ steps.start.outputs.config-dir }}
      run: |
        # https://docs.aws.amazon.com/emulator/latest/userguide/point-sdk-to-emulator.html
        # localhost ではなく 127.0.0.1 を使う（S3 がパススタイルになる）。
        {
          echo "AWS_ENDPOINT_URL=https://127.0.0.1:${PORT}"
          echo "AWS_SHARED_CREDENTIALS_FILE=${DIR}/emulator_credentials"
          echo "AWS_CONFIG_FILE=${DIR}/config"
          echo "AWS_CA_BUNDLE=${DIR}/ca.pem"
          echo "AWS_EC2_METADATA_DISABLED=true"
          echo "AWS_DISABLE_HOST_PREFIX_INJECTION=true"
          echo "AWS_REGION=${REGION}"
          echo "AWS_DEFAULT_REGION=${REGION}"
        } >> "${GITHUB_ENV}"

    - name: Verify connection to the emulator
      shell: bash
      run: |
        set -euo pipefail
        # 以降のステップが本物の AWS ではなくエミュレーターに繋がることを確認する。
        account=$(aws sts get-caller-identity --query Account --output text)
        if [ "${account}" != "000000000000" ]; then
          echo "::error::エミュレーター以外 (account=${account}) に接続しています"
          exit 1
        fi
        echo "Connected to AWS Emulator (account ${account})"
